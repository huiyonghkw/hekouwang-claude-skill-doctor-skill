name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Syntax check (zero deps)
        run: python -m py_compile check.py

      # trigger_eval.py 要 claude CLI 才能真跑，CI 里只能验语法。
      # 但必须验 —— 否则它进了仓库却没人看着，改坏了要等用户踩到才知道。
      - name: Optional engine syntax check
        run: python -m py_compile scripts/trigger_eval.py

      - name: Good fixture should pass (exit 0)
        run: python3 check.py tests/fixtures/good

      - name: Bad fixture should fail (exit 1)
        run: |
          if python3 check.py tests/fixtures/bad; then
            echo "::error::expected a FAIL gate but check passed"
            exit 1
          else
            echo "correctly gated (exit 1)"
          fi

      - name: JSON output is valid
        run: |
          python3 check.py tests/fixtures/good --json > "$RUNNER_TEMP/skill-doctor-good.json"
          python3 -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' \
            "$RUNNER_TEMP/skill-doctor-good.json"

      - name: Regression tests for parser, profiles, pointers, and scan
        run: |
          bash tests/test-dead-pointer.sh
          bash tests/test-frontmatter.sh
          bash tests/test-codex-profile.sh
          bash tests/test-scan.sh
          bash tests/test-suite-fail-closed.sh
